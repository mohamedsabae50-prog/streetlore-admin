name: Deploy Admin Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-admin-web
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --base-href "/streetlore-admin/"

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          user_name: 'streetlore-mavis'
          user_email: 'streetlore-mavis@users.noreply.github.com'