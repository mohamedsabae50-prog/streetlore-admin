name: Deploy Admin Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-admin-web
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --base-href "/streetlore-admin/"

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Push build/web to gh-pages
        run: |
            set -e
            BUILD_SHA="${GITHUB_SHA::7}"
            COMMIT_MSG="${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-update}"
            COMMIT_MSG=${COMMIT_MSG%%$'\n'*}
            git config user.name 'streetlore-mavis'
            git config user.email 'streetlore-mavis@users.noreply.github.com'
            TMP_DIR=$(mktemp -d)
            git worktree add -f "$TMP_DIR" gh-pages
            cd "$TMP_DIR"
            # Clear everything except .git
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            cp -r $GITHUB_WORKSPACE/build/web/. .
            touch .nojekyll
            git add -A
            git commit -m "deploy: admin web from $COMMIT_MSG ($BUILD_SHA)"
            git push origin gh-pages
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$TMP_DIR"